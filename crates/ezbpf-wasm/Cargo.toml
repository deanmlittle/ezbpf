[package]
name = "ezbpf-wasm"
version = "0.1.0"
edition = "2021"
authors = ["Dean Little <@deanmlittle>"]

[lib]
name = "ezbpf_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
wasm-bindgen = "0.2"
hex = "0.4"
ezbpf-core = { path = "../ezbpf-core" }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"

[dev-dependencies]
hex-literal = "1.0"
